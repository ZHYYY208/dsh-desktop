name: build-deb

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-linux:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install build deps
        run: npm ci

      - name: Prepare runtime (downloads bundled Node + installs dsh CLI)
        run: node scripts/prepare-runtime-linux.cjs

      - name: Build .deb (Electron native app)
        run: npx electron-builder --linux deb --publish never

      - name: Verify the packaged CLI is inside the .deb
        run: |
          dpkg-deb -c dist/*.deb | grep -q "resources/node-runtime/bin/node"
          dpkg-deb -c dist/*.deb | grep -q "resources/runtime/node_modules/@deepseek-ai/dsh/lib/bin.js"

      - name: Upload .deb artifact
        uses: actions/upload-artifact@v4
        with:
          name: dsh-desktop-linux-deb
          path: dist/*.deb
          if-no-files-found: error

      - name: Attach .deb to GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: dist/*.deb
          generate_release_notes: true
